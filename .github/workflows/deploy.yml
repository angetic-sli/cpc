name: Deploy CPC to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, curl
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # The Laravel application must be outside public_html.
      # Set FTP_APP_DIR to a sibling directory such as /cpc_app/.
      - name: Deploy Laravel application (outside web root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_APP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.github/**
            **/.vscode/**
            .env
            .env.*
            !.env.example
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/framework/testing/**
            **/public/hot

      # Publish only public assets into public_html. The index.php path is adjusted
      # for the sibling layout: public_html/ and cpc_app/.
      - name: Prepare public web root
        run: |
          mkdir -p deploy-public
          cp -a public/. deploy-public/
          sed -i "s#\$__DIR__.'/../storage/framework/maintenance.php'#\$__DIR__.'/../cpc_app/storage/framework/maintenance.php'#; s#\$__DIR__.'/../vendor/autoload.php'#\$__DIR__.'/../cpc_app/vendor/autoload.php'#; s#\$__DIR__.'/../bootstrap/app.php'#\$__DIR__.'/../cpc_app/bootstrap/app.php'#" deploy-public/index.php

      - name: Deploy public files to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-public/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/hot
